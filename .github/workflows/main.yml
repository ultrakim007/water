name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: "빌드 유형 선택 (debug: 테스트용 / release: 배포용 서명 APK)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Build APK (${{ inputs.build_type || (startsWith(github.ref, 'refs/tags/v') && 'release' || 'debug') }})
    runs-on: ubuntu-latest

    env:
      BUILD_TYPE: ${{ inputs.build_type || (startsWith(github.ref, 'refs/tags/v') && 'release' || 'debug') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Generate debug.keystore for debug builds
        if: env.BUILD_TYPE == 'debug'
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        if: env.BUILD_TYPE == 'debug'
        run: gradle :app:assembleDebug --no-daemon

      - name: Decode Release Keystore
        if: env.BUILD_TYPE == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Error: KEYSTORE_BASE64 secret is not configured in GitHub Repository Secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/my-upload-key.jks"

      - name: Build Release APK
        if: env.BUILD_TYPE == 'release'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Clean up temporary release keystore
        if: always() && env.BUILD_TYPE == 'release'
        run: rm -f "${{ github.workspace }}/my-upload-key.jks"

      - name: Upload Debug APK Artifact
        if: env.BUILD_TYPE == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: yakmul-check-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        if: env.BUILD_TYPE == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: yakmul-check-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
